# cosmoderm-instagram deposunda .github/workflows/publish.yml olarak durur.
# 15 dakikada bir çalışır (GitHub saatlik çalışmaları atlayabiliyor, 04.10); zamanı gelen paylaşımı Instagram'a gönderir, state/posted.json'u depoya geri yazar.
name: Instagram paylaşım

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Sadece dene, paylaşma (1 = evet)'
        default: '0'

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Paylaş
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: node publish.mjs
      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "cosmoderm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/posted.json || true
          git diff --cached --quiet || (git commit -m "paylaşım durumu $(date -u +%F' '%H:%M)" && git push)
