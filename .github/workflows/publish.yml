# cosmoderm-instagram deposunda .github/workflows/publish.yml olarak durur.
# 15 dakikada bir çalışır (GitHub saatlik çalışmaları atlayabiliyor, 04.10); zamanı gelen paylaşımı Instagram'a gönderir, state/posted.json'u depoya geri yazar.
name: Instagram paylaşım

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Sadece dene, paylaşma (1 = evet)'
        default: '0'

permissions:
  contents: write
  issues: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # ref: main ŞART — yoksa sırada bekleyen tur tetiklendiği andaki ESKİ posted.json ile açılır ve aynı videoyu tekrar paylaşır (05.10 çift paylaşım olayı)
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Paylaş
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: node publish.mjs
      # Yorum oto-cevabı (06.10). Depo değişkeni COMMENTS_LIVE=1 olana kadar sadece DENEME (log'a yazar, göndermez).
      - name: Yorumları cevapla
        if: always()
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          WA_ORDER: ${{ vars.WA_ORDER }}
          CALLMEBOT_KEY: ${{ secrets.CALLMEBOT_KEY }}
          NOTIFY_PHONE: ${{ secrets.NOTIFY_PHONE }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ vars.COMMENTS_LIVE == '1' && '0' || '1' }}
        run: node comments.mjs
      # İstatistik toplama (06.10 Faz 1): gönderiler 2 saatte, Story'ler saatte bir (kendi aralığını state/insights.json'da tutar)
      - name: İstatistik topla
        if: always()
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node insights.mjs
      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "cosmoderm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/ metrics/ 2>/dev/null || git add state/posted.json || true
          git diff --cached --quiet || git commit -m "paylaşım durumu $(date -u +%F' '%H:%M)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
